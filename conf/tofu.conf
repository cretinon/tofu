# tofu lib configuration -- sourced by $MY_GIT_DIR/tofu/lib_tofu.sh at load time.
# The environment always wins: a variable already set is kept as-is.

# OpenTofu binary: a name found in PATH, or an absolute path.
TOFU_BIN="${TOFU_BIN:-tofu}"

# Directory holding the *.tf files (empty = $MY_GIT_DIR/tofu).
TOFU_DIR="${TOFU_DIR:-}"

# Variable file used when --var-file is not given
# (empty = terraform.tfvars, used only when that file exists).
TOFU_VAR_FILE="${TOFU_VAR_FILE:-}"
